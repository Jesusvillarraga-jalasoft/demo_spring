name: CI Pipeline

# Se ejecuta en cada push o pull request a la rama assignments/githubactions_test
on:
  push:
    branches: [ "assignments/githubactions_test" ]
  pull_request:
    branches: [ "assignments/githubactions_test" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar código
      - name: Checkout repository
        uses: actions/checkout@v3

      # Paso 2: Configurar JDK 17 (Spring Boot 3 usa JDK 17+)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Paso 3: Crear cache de depndencias
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Paso 4: Construir y ejecutar pruebas
      - name: Build with Maven
        run: mvn clean verify

      # Paso 5: Comprobar que empaqueta
      - name: Package Spring Boot app
        run: mvn clean package -DskipTests

      # Paso 6: Reportar con jacoco
      - name: Generate Coverage Report
        run: mvn jacoco:report

      # Paso 7: Reportar Artifact
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v3
        with:
          name: jacoco-report
          path: target/site/jacoco/